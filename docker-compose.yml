version: '3.8'

services:
  account:
    build:
      context: .
      dockerfile: account/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - POSTGRES_URL=jdbc:postgresql://account-postgres:5432/account
      - POSTGRES_USER=${ACCOUNT_POSTGRES_USER}
      - POSTGRES_PASSWORD=${ACCOUNT_POSTGRES_PASSWORD}
      - DOCKER_COMPOSE_ENABLED=false
    depends_on:
      - account-postgres
  account-postgres:
    image: postgres:17.4-alpine
    environment:
      - POSTGRES_DB=account
      - POSTGRES_USER=${ACCOUNT_POSTGRES_USER}
      - POSTGRES_PASSWORD=${ACCOUNT_POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
